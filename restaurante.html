<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">



<title>Segunda Sorpresa</title>

 

<style>

 

body{

background:#fff4df;

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}

 

.caja{

background:white;

padding:40px;

border-radius:20px;

max-width:500px;

text-align:center;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

 

h1{

color:#d4a017;

}

 

input{

padding:10px;

width:200px;

}

 

button{

background:#d4a017;

color:white;

border:none;

padding:10px 20px;
border-radius:20px;

cursor:pointer;

}

</style>

 

</head>

 

<body>

 

<div class="caja">

 

<h1>💛 Segunda Sorpresa</h1>

 

<p>

Espero que hayas disfrutado las flores.

</p>

 

<p>

Todavía quedan más sorpresas por descubrir.

</p>

 

<h3>

¿Cuál es nuestra canción?

</h3>

 

<input id="respuesta">

 

<br><br>

 

<button onclick="verificar()">

Comprobar

</button>


<p id="resultado"></p>

 

</div>

 

<script>

 

function verificar(){

 

let respuesta =

document.getElementById("respuesta")

.value

.toLowerCase()

.trim();

 

if(respuesta=="yellow"){

 

document.getElementById("resultado")

.innerHTML=

"✅ Correcto 💛<br><br>Tu siguiente sorpresa te espera en casa.";

 

}else{

 

document.getElementById("resultado")

.innerHTML=

"❌ Intenta otra vez.";

 

}

}

</script>

 

</body>

</html>
