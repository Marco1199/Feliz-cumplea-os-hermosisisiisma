<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños ❤️</title>

  <style>
body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fff0f5;
font-family:Arial,sans-serif;
}

    .tarjeta{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
max-width:500px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
color:#ff4d88;
}
 
input{
padding:10px;
width:80%;
}
 
button{
margin-top:15px;
padding:12px 25px;
background:#ff4d88;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
} 

 #resultado{
margin-top:15px;
font-weight:bold;
}
</style>
</head>
 
<body>
 
<div class="tarjeta">
<h1>🎂 Feliz Cumpleaños ❤️</h1>
 
<p>
Tengo una sorpresa para ti, pero primero tendrás que resolver un reto.
</p>   

  <p>
Reflejo todo lo que ves, pero jamás hablo.
Estoy contigo cada mañana.
¿Qué soy?
</p>
 
<input id="respuesta" placeholder="Escribe tu respuesta">
 
<br>
 
<button onclick="verificar()">
Responder
</button>
 
<p id="resultado"></p>
</div>
 
<script>
function verificar() {
let respuesta =
document.getElementById("respuesta")
.value
.toLowerCase()
.trim();
 
if (respuesta === "espejo") {
document.getElementById("resultado").innerHTML =
"✅ Correcto. Busca cerca del espejo tu siguiente pista ❤️";
} else {
document.getElementById("resultado").innerHTML =
"❌ Intenta nuevamente";
}
}
</script>

</body>
</html>
