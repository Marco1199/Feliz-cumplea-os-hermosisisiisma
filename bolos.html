<!DOCTYPE html>

<html lang="es">



<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

 

<title>🎳 Tercera Misión</title>

 

<style>

 

body{

background:#eef5ff;

font-family:Arial, sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

margin:0;

}

 

.caja{

background:white;

max-width:600px;

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:0 0 20px rgba(0,0,0,.1);

}

 

h1{

color:#3366cc;

}

 

input{

padding:12px;

width:220px;

border-radius:10px;

border:1px solid #ccc;

}

 

button{

background:#3366cc;

color:white;

border:none;

padding:12px 25px;

border-radius:20px;

cursor:pointer;

margin-top:15px;

}


#resultado{

margin-top:20px;

font-size:18px;

}

 

</style>

 

</head>

 

<body>

 

<div class="caja">

<h1>🎳 Tercera Misión</h1>

 

<p>

Hasta ahora has demostrado ser una gran detective.

</p>

 

<p>

Pero esta vez si quieres la pista trendras que ganarme en los bolos. Solo asi tendras el codigo jajajaja

</p>

 

<p>

Ingresa el código secreto:

</p>

 

<input

id="codigo"

placeholder="DD/MM/AAAA">

 

<br>

 

<button onclick="verificar()">

Desbloquear pista

</button>

 

<div id="resultado"></div>

</div>

<script>

 

function verificar(){

let codigo =

document.getElementById("codigo")

.value

.trim();

 

if(codigo=="22/08/2026"){

 

document.getElementById("resultado").innerHTML=

"💃 ¡Correcto!<br><br>Ponte algo bonito.<br><br>Arréglate como más te guste.<br><br>Porque esta noche vamos a bailar ❤️✨";

 

}else{

document.getElementById("resultado").innerHTML=

"❌ Ese no es el código secreto.";

 

}

}

 

</script>

 

</body>

 

</html>

`
